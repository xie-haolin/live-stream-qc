          - '1801000000003'
          - item
        desc: 抽取类+判定类合一：一段文本同时抽车系 + 打违规0-4分
        isInIteration: true
        isInLoop: false
        iteration_id: '1801000000003'
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 2048
            presence_penalty: 0
            temperature: 0
          mode: chat
          name: qwen2.5-max
          provider: tongyi
        prompt_template:
        - id: sys-qc
          role: system
          text: |-
            你是直播内容质检助手。读一段直播口播/转写文本，做两件事：
            1) 抽取文本里明确提到的汽车车系（如 问界M5 / M7 / M9、智界R7、享界S9 等），只列确实提到的，不要臆测。
            2) 判断该段是否存在违规表达，按 0–4 打分：
               0 正常：无违规，中性或正向陈述。
               1 轻微：轻微夸张但未触红线。
               2 中度：明显极限词/过度承诺（如"绝对第一""全网最低"）。
               3 严重：人身攻击、辱骂、脏话、地域/身份攻击。
               4 阴阳怪气：反讽、明褒暗贬、引战带节奏，字面上无脏话但恶意明显。

            只输出一个 JSON 对象，不要解释、不要代码块、不要 ```：
            {"series": ["车系1","车系2"], "violation_score": <0到4整数>, "violation_reason": "<一句话依据>"}

            示例：
            文本：今天给大家看看问界M9，这车绝对是同级别第一，买到就是赚 → {"series":["问界M9"],"violation_score":2,"violation_reason":"使用绝对化极限词"}
            文本：问界M7空间真大，家里人都满意 → {"series":["问界M7"],"violation_score":0,"violation_reason":"正常正向陈述"}
            文本：这牌子就是垃圾，买的人都是傻子 → {"series":[],"violation_score":3,"violation_reason":"人身攻击"}
        - id: user-qc
          role: user
          text: '文本：{{#1801000000003.item#}}'
        selected: false
        title: LLM_块分析
        type: llm
        variables: []
        vision:
          enabled: false
      extent: parent
      height: 116
      id: '1801000000004'
      parentId: '1801000000003'
      position:
        x: 181
        y: 60
      positionAbsolute:
        x: 801
        y: 310
