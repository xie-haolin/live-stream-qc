    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 直播转写稿（口播/字幕文本）
          options: []
          required: true
          type: paragraph
          variable: transcript
      height: 150
      id: '1801000000001'
      position:
        x: 30
        y: 250
      positionAbsolute:
        x: 30
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          def main(transcript: str) -> dict:
              text = transcript or ""
              size = 1000
              overlap = 80
              if not text:
                  return {"blocks": []}
              if len(text) <= size:
                  blocks = [text]
              else:
                  blocks = []
                  step = size - overlap
                  i = 0
                  while i < len(text):
                      blocks.append(text[i:i + size])
                      i += step
              return {"blocks": blocks}
        code_language: python3
        desc: 切句分块：长直播稿切成 1000 字/块、重叠 80 字，单块上下文短 → 模型更准、token 更省
        outputs:
          blocks:
            type: array[string]
        selected: false
        title: 切句分块
        type: code
        variables:
        - value_selector:
