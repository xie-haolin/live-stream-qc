app:
  name: 直播内容智能质检流水线
  description: '秋招项目：直播/短视频内容智能质检。输入直播转写稿，先做切句分块，再用并发迭代逐块「抽取车系+判定违规0-4」，随后用代码做确定性后处理（屏蔽词正则过滤 + 车系归一化去重 + 统计），输出结构化质检报告。设计范式：LLM识别 + 代码后处理职责分离、迭代并发(is_parallel)提速、失败隔离(remove-abnormal-output)不拖垮整批。注意：样例数据与屏蔽词表均为演示用，不引用任何公司资产。'
  mode: workflow
  icon: 🛡️
  icon_background: '#DBEAFE'
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
