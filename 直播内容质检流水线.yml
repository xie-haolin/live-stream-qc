        - value_selector:
          - '1801000000007'
          - total
          variable: total
        - value_selector:
          - '1801000000007'
          - counts
          variable: counts
        - value_selector:
          - '1801000000007'
          - violations
          variable: violations
        - value_selector:
          - '1801000000007'
          - keyword_hits
          variable: keyword_hits
        selected: false
        title: 结束
        type: end
