      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1002
    - data:
        code: |-
          import json
          import re


          def _clean(t: str) -> str:
              t = re.sub(r"<\s*think\s*>.*?<\s*/\s*think\s*>", "", t or "", flags=re.DOTALL)
              t = re.sub(r"<\s*thinking\s*>.*?<\s*/\s*thinking\s*>", "", t or "", flags=re.DOTALL)
              t = re.sub(r"```(?:json)?\s*", "", t, flags=re.IGNORECASE)
              t = t.replace("```", "")
              return t.strip()


          def _extract_obj(text: str):
              try:
                  return json.loads(text)
              except Exception:
                  pass
              s = text.find("{")
              e = text.rfind("}")
              if s != -1 and e > s:
                  try:
                      return json.loads(text[s:e + 1])
                  except Exception:
                      pass
              m = re.search(r"\{[^{}]*\}", text, flags=re.DOTALL)
              if m:
                  try:
                      return json.loads(m.group(0))
                  except Exception:
                      pass
              return None


          def main(llm_output: str) -> dict:
              obj = _extract_obj(_clean(llm_output or ""))
              if not isinstance(obj, dict):
                  return {"item_result": {"series": [], "violation_score": -1, "violation_reason": "模型未返回可解析JSON"}}
              raw_series = obj.get("series", [])
              series = []
              if isinstance(raw_series, list):
                  for s in raw_series:
                      s = str(s).strip()
                      if s:
                          series.append(s)
              try:
                  score = int(obj.get("violation_score", -1))
              except Exception:
                  score = -1
              if score not in (0, 1, 2, 3, 4):
                  score = -1
              reason = str(obj.get("violation_reason", "")).strip()
              return {"item_result": {"series": series, "violation_score": score, "violation_reason": reason, "is_violation": score >= 3}}
        code_language: python3
        desc: 解析层：剥think+抽最外层JSON+取series/score，包裹成item_result对象（确定性解析，不调LLM）
        outputs:
          item_result:
            type: object
        selected: false
        title: 解析块结果
        type: code
        variables:
        - value_selector:
          - '1801000000004'
          - text
          value_type: string
          variable: llm_output
