    - data:
        code: |-
          # 确定性兜底：屏蔽词用正则/子串匹配，零 LLM 调用
          # 演示用极限词表，实际部署替换为业务自有词表即可
          KEYWORDS = ["绝对第一", "全网最低", "国家级", "最牛", "秒杀一切", "100%有效", "史上最强", "唯一指定"]


          def main(transcript: str) -> dict:
              text = transcript or ""
              hits = []
              for kw in KEYWORDS:
                  if kw and kw in text:
                      idx = text.find(kw)
                      start = max(0, idx - 20)
                      end = min(len(text), idx + len(kw) + 20)
                      hits.append({"keyword": kw, "context": text[start:end]})
              return {"hits": hits}
        code_language: python3
        desc: 屏蔽词过滤：子串匹配极限词，确定性执行（对比"让LLM判断违规"省一次LLM调用/块）
        outputs:
          hits:
            type: array[object]
        selected: false
        title: 屏蔽词过滤
        type: code
        variables:
        - value_selector:
          - '1801000000001'
          - transcript
          value_type: string
          variable: transcript
      height: 168
      id: '1801000000006'
      position:
        x: 1260
        y: 250
      positionAbsolute:
        x: 1260
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          # 车系归一化词库：演示"代码确定性后处理"如何替代反复调LLM做去重/别名合并
          NORM = {
              "m5": "问界M5", "问界m5": "问界M5", "m7": "问界M7", "问界m7": "问界M7",
              "m9": "问界M9", "问界m9": "问界M9", "r7": "智界R7", "s9": "享界S9",
              "s7": "智界S7", "s9t": "享界S9T",
          }


          def main(results: list, hits: list) -> dict:
              results = results or []
              norm_series = {}
              counts = {0: 0, 1: 0, 2: 0, 3: 0, 4: 0, -1: 0}
              violations = []
              for r in results:
                  if not isinstance(r, dict):
                      r = {}
                  for s in (r.get("series", []) or []):
                      key = str(s).strip().lower()
                      name = NORM.get(key, str(s).strip())
                      norm_series[name] = norm_series.get(name, 0) + 1
                  try:
                      sc = int(r.get("violation_score", -1))
                  except Exception:
                      sc = -1
                  counts[sc] = counts.get(sc, 0) + 1
                  if r.get("is_violation"):
                      violations.append({"score": sc, "reason": r.get("violation_reason", "")})
              series_list = sorted(norm_series.keys())
              total = len(results)
              report = (
                  f"识别车系 {len(series_list)} 个：{', '.join(series_list)}；"
                  f"共 {total} 段，违规 {len(violations)} 段；"
                  + " ".join(f"{k}分={counts.get(k, 0)}" for k in (0, 1, 2, 3, 4))
                  + f"；解析失败={counts.get(-1, 0)}；命中屏蔽词 {len(hits or [])} 处"
              )
              return {
                  "report": report,
                  "series_list": series_list,
                  "series_count": len(series_list),
                  "total": total,
                  "counts": counts,
                  "violations": violations,
                  "keyword_hits": hits or [],
              }
        code_language: python3
        desc: 合并对齐：车系归一化去重 + 违规分档计数 + 屏蔽词命中汇总，全部代码确定性完成
        outputs:
          report:
            type: string
          series_list:
            type: array[string]
          series_count:
            type: number
          total:
            type: number
          counts:
            type: object
          violations:
            type: array[object]
          keyword_hits:
            type: array[object]
        selected: false
        title: 合并对齐
        type: code
        variables:
        - value_selector:
          - '1801000000003'
          - output
          value_type: array[object]
          variable: results
        - value_selector:
          - '1801000000006'
          - hits
          value_type: array[object]
          variable: hits
      height: 200
      id: '1801000000007'
      position:
        x: 1580
        y: 250
      positionAbsolute:
        x: 1580
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 返回结构化质检报告
        outputs:
        - value_selector:
          - '1801000000007'
          - report
          variable: report
        - value_selector:
